name: CI - Android x86_64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build x86_64 core
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make platform=android-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: na_libretro_android_x86_64
          path: na_libretro_android.so

      - name: Rename x86_64 library
        run: mv na_libretro_android.so na_libretro_android_x86_64.so

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: na_libretro_android_x86_64.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
